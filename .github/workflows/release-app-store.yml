name: Release to App Store

# Manual only -- never fires on push/PR.
#
# Unlike modebi's release-app-store.yml (a bare Xcode project that runs its
# own xcodebuild archive/export/upload), this is a managed Expo project: EAS
# Build compiles and code-signs on Expo's infrastructure (credentials are
# already registered against this Expo project, see `eas credentials`), so
# this runner only needs Node + eas-cli and never touches Xcode. EAS Submit
# still needs its own App Store Connect API key, independent of the
# code-signing identity, so that part of modebi's pattern (write the .p8 from
# a base64/PEM secret, validate it, clean it up after) carries over as-is.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-app-store
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit to App Store Connect via EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key to a temp file
        # ASC_API_KEY_P8_BASE64 may hold either the base64 of the .p8 file or
        # the raw .p8 PEM text itself; both are accepted. Whitespace/CRLF from
        # copy-paste is stripped before decoding. Written to $RUNNER_TEMP, not
        # the checkout, so it never ends up in a commit, log upload, or cache.
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for v in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret for $v is empty or not set." >&2
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          if printf '%s' "$ASC_API_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s\n' "$ASC_API_KEY_P8" | tr -d '\r' > "$KEY_PATH"
          elif ! printf '%s' "$ASC_API_KEY_P8" | tr -d ' \t\r\n' | base64 --decode > "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8_BASE64 is neither valid base64 nor a raw .p8 PEM. Re-create it with: base64 -i AuthKey_XXXX.p8 | tr -d '\n'" >&2
            exit 1
          fi
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH" || {
            echo "::error::Decoded ASC_API_KEY_P8_BASE64 is not a .p8 private key (no BEGIN PRIVATE KEY header)." >&2
            exit 1
          }
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Point eas.json's submit profile at the key for this run
        # eas.json ships with an empty submit.production placeholder (no
        # Apple identifiers committed to the repo). EAS Submit reads
        # ascApiKeyPath/Id/IssuerId from eas.json, so this run's values are
        # patched in here rather than hardcoded, then discarded with the
        # rest of the checkout when the job ends.
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const easJson = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            easJson.submit ??= {};
            easJson.submit.production ??= {};
            easJson.submit.production.ios = {
              ascApiKeyPath: process.env.ASC_API_KEY_PATH,
              ascApiKeyIssuerId: process.env.ASC_API_ISSUER_ID,
              ascApiKeyId: process.env.ASC_API_KEY_ID,
            };
            fs.writeFileSync('eas.json', JSON.stringify(easJson, null, 2) + '\n');
          "

      - name: Build and submit to App Store Connect
        # GH Actions runs `run:` steps with `bash -e` but not `pipefail`, so
        # piping into `tee` would make this step report success even when
        # `eas-cli` fails (the pipeline's exit code is tee's, which is
        # always 0). Set pipefail explicitly so a real failure here fails
        # the job instead of silently passing.
        run: |
          set -o pipefail
          npx eas-cli build --platform ios --profile production --non-interactive --auto-submit --wait 2>&1 | tee "$RUNNER_TEMP/eas-build-submit.log"

      - name: Remove API key from disk
        if: always()
        run: rm -f "${ASC_API_KEY_PATH:-}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-app-store-logs
          path: ${{ runner.temp }}/eas-build-submit.log
          if-no-files-found: ignore
          retention-days: 14
